<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Lead — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0e13;
    --surface: #14171e;
    --surface-2: #1a1e27;
    --border: #252a36;
    --border-accent: #2d3344;
    --text: #c8cdd8;
    --text-muted: #6b7280;
    --text-bright: #e8ecf4;
    --accent: #3b82f6;
    --accent-dim: #1e3a6e;
    --green: #22c55e;
    --green-dim: #14532d;
    --red: #ef4444;
    --red-dim: #7f1d1d;
    --amber: #f59e0b;
    --amber-dim: #78350f;
    --purple: #a78bfa;
    --purple-dim: #3b1f7e;
    --mono: 'JetBrains Mono', monospace;
    --sans: 'IBM Plex Sans', -apple-system, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
  }

  /* ═══ Header ═══ */
  .header {
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface);
    flex-shrink: 0;
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .logo { font-family: var(--mono); font-size: 15px; font-weight: 700; color: var(--text-bright); letter-spacing: -0.5px; }
  .logo span { color: var(--accent); }
  .header-status {
    font-family: var(--mono); font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.8px; padding: 3px 10px; border-radius: 3px;
  }
  .status-active { background: var(--accent-dim); color: var(--accent); }
  .status-awaiting-standup { background: var(--amber-dim); color: var(--amber); }
  .status-awaiting-human-input { background: var(--amber-dim); color: var(--amber); }
  .status-error { background: var(--red-dim); color: var(--red); }
  .status-project-complete { background: var(--green-dim); color: var(--green); }
  .status-sprint-complete { background: var(--green-dim); color: var(--green); }
  .header-right { display: flex; align-items: center; gap: 14px; font-family: var(--mono); font-size: 11px; color: var(--text-muted); }
  .refresh-btn {
    background: none; border: 1px solid var(--border); color: var(--text-muted);
    font-family: var(--mono); font-size: 11px; padding: 3px 10px; border-radius: 3px; cursor: pointer;
  }
  .refresh-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ═══ Main layout: fills remaining viewport ═══ */
  .main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 360px;
    grid-template-rows: 1fr auto;
    gap: 1px;
    background: var(--border);
    overflow: hidden;
    min-height: 0;
  }

  /* ═══ Panels ═══ */
  .panel {
    background: var(--surface);
    padding: 14px 16px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .panel-title {
    font-family: var(--mono); font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 1.2px; color: var(--text-muted); margin-bottom: 10px;
    display: flex; align-items: center; gap: 6px; flex-shrink: 0;
  }
  .panel-title::before {
    content: ''; width: 6px; height: 6px; border-radius: 1px;
    background: var(--accent); display: inline-block;
  }

  /* ═══ LEFT: Agent Logs (top) ═══ */
  .agent-logs-panel { grid-column: 1; grid-row: 1; }
  .agent-logs-scroll { overflow-y: auto; flex: 1; min-height: 0; }
  .reload-btn {
    background: none; border: 1px solid var(--border); color: var(--text-muted);
    font-size: 12px; cursor: pointer; padding: 1px 7px; border-radius: 3px; margin-left: 6px;
  }
  .reload-btn:hover { color: var(--text); border-color: var(--text-muted); }

  .agent-log-item { border: 1px solid var(--border); border-radius: 4px; margin-bottom: 4px; }
  .agent-log-header {
    display: flex; align-items: center; gap: 8px; padding: 7px 12px; cursor: pointer;
    font-family: var(--mono); font-size: 11px; background: rgba(255,255,255,0.015);
    user-select: none;
  }
  .agent-log-header:hover { background: rgba(255,255,255,0.04); }
  .agent-log-chevron { color: var(--text-muted); transition: transform 0.15s; font-size: 10px; }
  .agent-log-item.open .agent-log-chevron { transform: rotate(90deg); }
  .agent-log-agent { font-weight: 600; min-width: 100px; }
  .agent-log-agent.po { color: var(--purple); }
  .agent-log-agent.dev { color: var(--accent); }
  .agent-log-agent.tester { color: var(--green); }
  .agent-log-status { padding: 1px 6px; border-radius: 3px; font-size: 9px; font-weight: 600; }
  .agent-log-status.success { background: rgba(34,197,94,0.12); color: var(--green); }
  .agent-log-status.error { background: rgba(239,68,68,0.12); color: var(--red); }
  .agent-log-stop { color: var(--text-muted); font-size: 10px; }
  .agent-log-time { color: var(--text-muted); margin-left: auto; font-size: 10px; }
  .agent-log-body {
    display: none; padding: 10px 12px; border-top: 1px solid var(--border);
    font-family: var(--mono); font-size: 11px; line-height: 1.6; color: var(--text-muted);
    white-space: pre-wrap; word-break: break-word; max-height: 350px; overflow-y: auto;
  }
  .agent-log-item.open .agent-log-body { display: block; }

  /* ═══ RIGHT: stacked panels, scrollable ═══ */
  .right-stack {
    grid-column: 2; grid-row: 1 / 3;
    background: var(--surface);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }
  .right-stack .rpanel {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }
  .right-stack .rpanel:last-child { border-bottom: none; }
  .rpanel-title {
    font-family: var(--mono); font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 1.2px; color: var(--text-muted); margin-bottom: 10px;
    display: flex; align-items: center; gap: 6px;
  }
  .rpanel-title::before {
    content: ''; width: 6px; height: 6px; border-radius: 1px;
    background: var(--accent); display: inline-block;
  }

  /* ═══ BOTTOM: Activity Log ═══ */
  .activity-log-panel {
    grid-column: 1; grid-row: 2;
    max-height: 180px;
  }
  .log-scroll { overflow-y: auto; flex: 1; min-height: 0; }
  .log-entry {
    display: flex; gap: 10px; padding: 3px 0; border-bottom: 1px solid rgba(37,42,54,0.5);
    font-family: var(--mono); font-size: 10px; align-items: baseline;
  }
  .log-time { color: var(--text-muted); min-width: 42px; flex-shrink: 0; }
  .log-agent { min-width: 70px; flex-shrink: 0; font-weight: 500; }
  .log-agent-product-owner { color: var(--purple); }
  .log-agent-dev { color: var(--accent); }
  .log-agent-tester { color: var(--green); }
  .log-agent-project-lead { color: var(--amber); }
  .log-action { color: var(--text); flex: 1; }
  .log-cost { color: var(--text-muted); min-width: 50px; text-align: right; flex-shrink: 0; }

  /* ═══ Task Card ═══ */
  .task-card {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px; padding: 10px 12px;
  }
  .task-meta { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
  .task-meta-item { font-family: var(--mono); font-size: 11px; }
  .task-meta-label { color: var(--text-muted); margin-right: 3px; }
  .task-meta-value { color: var(--text-bright); font-weight: 500; }
  .token-bar-container { margin-top: 4px; }
  .token-bar-label { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10px; color: var(--text-muted); margin-bottom: 3px; }
  .token-bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .token-bar-fill { height: 100%; border-radius: 2px; transition: width 0.4s; }
  .bar-green { background: var(--green); }
  .bar-amber { background: var(--amber); }
  .bar-red { background: var(--red); }

  /* ═══ Sprint Progress ═══ */
  .progress-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .sprint-name { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--text-bright); }
  .sprint-phase-tag {
    font-family: var(--mono); font-size: 10px; padding: 2px 8px; border-radius: 3px;
    background: var(--accent-dim); color: var(--accent); font-weight: 500;
  }
  .sprint-counter { font-family: var(--mono); font-size: 11px; color: var(--text-muted); margin-left: auto; }
  .stories-grid { display: flex; flex-direction: column; gap: 3px; }
  .story-row { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11px; padding: 2px 0; }
  .story-status-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .dot-done { background: var(--green); }
  .dot-in-progress { background: var(--accent); }
  .dot-not-started { background: var(--border-accent); }
  .dot-draft { background: var(--border-accent); }
  .dot-approved { background: var(--purple); }
  .dot-defect { background: var(--red); }
  .dot-blocked { background: var(--amber); }
  .story-id { color: var(--text-muted); min-width: 34px; }
  .story-title { color: var(--text); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .story-ac-progress { font-size: 10px; color: var(--accent); min-width: 26px; text-align: right; }
  .story-status-text { font-size: 10px; color: var(--text-muted); min-width: 50px; text-align: right; }

  /* ═══ Token Spend ═══ */
  .spend-total { font-family: var(--mono); font-size: 22px; font-weight: 700; color: var(--text-bright); margin-bottom: 8px; }
  .spend-total small { font-size: 11px; color: var(--text-muted); font-weight: 400; }
  .spend-bars { display: flex; flex-direction: column; gap: 6px; }
  .spend-row { display: flex; align-items: center; gap: 8px; }
  .spend-agent { font-family: var(--mono); font-size: 10px; color: var(--text-muted); min-width: 50px; }
  .spend-bar-track { flex: 1; height: 6px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .spend-bar-fill { height: 100%; border-radius: 2px; transition: width 0.4s; }
  .spend-cost { font-family: var(--mono); font-size: 10px; color: var(--text); min-width: 44px; text-align: right; }
  .bar-po { background: var(--purple); }
  .bar-dev { background: var(--accent); }
  .bar-tester { background: var(--green); }
  .bar-lead { background: var(--amber); }

  /* ═══ Action Required ═══ */
  .no-requests { font-family: var(--mono); font-size: 11px; color: var(--green); }
  .request-item { font-family: var(--mono); font-size: 11px; padding: 4px 0; border-bottom: 1px solid var(--border); }
  .request-blocks { font-size: 10px; color: var(--amber); margin-top: 2px; }

  /* ═══ States ═══ */
  .state-message {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 60vh; text-align: center; grid-column: 1 / 3; grid-row: 1 / 3; font-family: var(--mono);
  }
  .state-message h2 { font-size: 16px; color: var(--text-bright); margin-bottom: 8px; }
  .state-message p { font-size: 12px; color: var(--text-muted); max-width: 400px; line-height: 1.7; }
  .state-message code { background: var(--surface-2); padding: 2px 8px; border-radius: 3px; border: 1px solid var(--border); font-size: 12px; }
  .empty { color: var(--text-muted); font-family: var(--mono); font-size: 11px; text-align: center; padding: 12px 0; }

  /* ═══ Scrollbar ═══ */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-accent); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

  @media (max-width: 900px) {
    .main { grid-template-columns: 1fr; grid-template-rows: auto; }
    .agent-logs-panel, .right-stack, .activity-log-panel { grid-column: 1; grid-row: auto; }
    .right-stack { max-height: 50vh; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="logo">project<span>/</span>lead</div>
    <span id="status-badge" class="header-status status-active">—</span>
  </div>
  <div class="header-right">
    <span id="project-name">—</span>
    <span id="last-updated">—</span>
    <button class="refresh-btn" onclick="loadState(); loadAgentLogs();">refresh</button>
  </div>
</div>

<div class="main" id="main-grid">
  <div class="state-message">
    <h2>Loading...</h2>
    <p>Attempting to read <code>project-state.json</code></p>
  </div>
</div>

<template id="dashboard-template">
  <!-- LEFT TOP: Agent Logs -->
  <div class="panel agent-logs-panel">
    <div class="panel-title">Agent Logs <button class="reload-btn" onclick="loadAgentLogs()">↻</button></div>
    <div class="agent-logs-scroll" id="agent-logs-content">
      <div class="empty">Loading...</div>
    </div>
  </div>

  <!-- RIGHT: stacked sidebar -->
  <div class="right-stack">
    <div class="rpanel">
      <div class="rpanel-title">Current Task</div>
      <div id="task-content"></div>
    </div>
    <div class="rpanel">
      <div class="rpanel-title">Token Spend</div>
      <div id="spend-content"></div>
    </div>
    <div class="rpanel">
      <div class="rpanel-title">Sprint Progress</div>
      <div id="sprint-content"></div>
    </div>
    <div class="rpanel" id="requests-panel">
      <div class="rpanel-title">Action Required</div>
      <div id="requests-content"></div>
    </div>
  </div>

  <!-- LEFT BOTTOM: Activity Log -->
  <div class="panel activity-log-panel">
    <div class="panel-title">Activity Log</div>
    <div class="log-scroll" id="log-content"></div>
  </div>
</template>

<script>
const STATE_URL = './project-state.json';
let autoRefreshInterval = null;

async function loadState() {
  try {
    const resp = await fetch(STATE_URL + '?t=' + Date.now());
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const state = await resp.json();
    render(state);
  } catch (err) { showError(err.message); }
}

function showError(msg) {
  document.getElementById('main-grid').innerHTML = `
    <div class="state-message">
      <h2>Cannot load project state</h2>
      <p>${msg.includes('Failed to fetch') || msg.includes('NetworkError')
          ? `Serve the project directory:<br><br><code>python3 -m http.server 8080</code><br><br>Then open <code>http://localhost:8080/dashboard.html</code>`
          : `Error: ${msg}`}</p>
    </div>`;
}

function render(state) {
  document.getElementById('project-name').textContent = state.project || '—';
  document.getElementById('last-updated').textContent = formatTime(state.last_updated);
  const badge = document.getElementById('status-badge');
  badge.textContent = (state.status || '—').replace(/-/g, ' ');
  badge.className = 'header-status status-' + (state.status || 'active');

  const tmpl = document.getElementById('dashboard-template');
  const grid = document.getElementById('main-grid');
  grid.innerHTML = '';
  grid.appendChild(tmpl.content.cloneNode(true));

  renderTask(state);
  renderSpend(state);
  renderSprint(state);
  renderRequests(state);
  renderLog(state);
  loadAgentLogs();
}

function renderTask(state) {
  const el = document.getElementById('task-content');
  const task = state.current_task;
  if (!task || !task.story) { el.innerHTML = '<div class="empty">No active task</div>'; return; }
  const pct = task.token_budget > 0 ? Math.min(100, Math.round((task.tokens_used / task.token_budget) * 100)) : 0;
  const barClass = pct > 80 ? 'bar-red' : pct > 50 ? 'bar-amber' : 'bar-green';
  el.innerHTML = `
    <div class="task-card">
      <div class="task-meta">
        <div class="task-meta-item"><span class="task-meta-label">story</span> <span class="task-meta-value">${task.story}</span></div>
        <div class="task-meta-item"><span class="task-meta-label">AC</span> <span class="task-meta-value">${task.acceptance_criterion || '—'}</span></div>
        <div class="task-meta-item"><span class="task-meta-label">agent</span> <span class="task-meta-value">${task.assigned_to || '—'}</span></div>
        <div class="task-meta-item"><span class="task-meta-label">started</span> <span class="task-meta-value">${formatTime(task.started_at)}</span></div>
      </div>
      <div class="token-bar-container">
        <div class="token-bar-label"><span>tokens ${numFmt(task.tokens_used)} / ${numFmt(task.token_budget)}</span><span>${pct}%</span></div>
        <div class="token-bar"><div class="token-bar-fill ${barClass}" style="width:${pct}%"></div></div>
      </div>
    </div>`;
}

function renderRequests(state) {
  const el = document.getElementById('requests-content');
  const panel = document.getElementById('requests-panel');
  const reqs = state.human_requests || [];
  if (reqs.length === 0) {
    // Collapse the panel when empty — just a thin line
    el.innerHTML = '<div class="no-requests">Nothing needed ✓</div>';
    return;
  }
  el.innerHTML = reqs.map(r => `
    <div class="request-item ${r.status === 'fulfilled' ? 'fulfilled' : ''}">
      <div>${r.request || r}</div>
      ${r.blocks ? `<div class="request-blocks">blocks: ${r.blocks}</div>` : ''}
    </div>`).join('');
}

function renderSprint(state) {
  const el = document.getElementById('sprint-content');
  const sprint = state.current_sprint;
  const summary = state.sprint_summary && state.sprint_summary[sprint];
  if (!sprint) { el.innerHTML = '<div class="empty">No sprint active</div>'; return; }
  const phase = state.current_phase || '—';
  const stories = summary ? summary.stories || [] : [];
  const done = summary ? (summary.stories_done || 0) : 0;
  const total = summary ? (summary.total_stories || 0) : 0;
  let storiesHtml = '';
  if (Array.isArray(stories) && stories.length > 0) {
    storiesHtml = stories.map(s => {
      const dotClass = statusToDot(s.status);
      const acProg = (s.acs_total > 0) ? `${s.acs_done || 0}/${s.acs_total}` : '';
      return `<div class="story-row">
        <span class="story-status-dot ${dotClass}"></span>
        <span class="story-id">${s.id}</span>
        <span class="story-title">${s.title || ''}</span>
        <span class="story-ac-progress">${acProg}</span>
        <span class="story-status-text">${s.status || ''}</span>
      </div>`;
    }).join('');
  } else {
    storiesHtml = `<div class="empty">${total > 0 ? done+'/'+total+' stories' : 'No story data yet'}</div>`;
  }
  el.innerHTML = `
    <div class="progress-header">
      <span class="sprint-name">${sprint}</span>
      <span class="sprint-phase-tag">${phase}</span>
      <span class="sprint-counter">${done}/${total}</span>
    </div>
    <div class="stories-grid">${storiesHtml}</div>`;
}

function renderSpend(state) {
  const el = document.getElementById('spend-content');
  const sprint = state.current_sprint;
  const spend = state.token_spend && state.token_spend[sprint];
  if (!spend) { el.innerHTML = '<div class="empty">No spend data</div>'; return; }
  const total = spend.cost_usd || 0;
  const agents = [
    { key: 'product-owner', label: 'po', cls: 'bar-po' },
    { key: 'dev', label: 'dev', cls: 'bar-dev' },
    { key: 'tester', label: 'tester', cls: 'bar-tester' },
    { key: 'project-lead', label: 'lead', cls: 'bar-lead' }
  ];
  const agentCosts = agents.map(a => spend[a.key + '_cost'] || 0);
  const maxCost = Math.max(...agentCosts, 0.01);
  el.innerHTML = `
    <div class="spend-total">$${total.toFixed(2)} <small>this sprint</small></div>
    <div class="spend-bars">
      ${agents.map(a => {
        const cost = spend[a.key + '_cost'] || 0;
        const pct = Math.round((cost / maxCost) * 100);
        return `<div class="spend-row">
          <span class="spend-agent">${a.label}</span>
          <div class="spend-bar-track"><div class="spend-bar-fill ${a.cls}" style="width:${pct}%"></div></div>
          <span class="spend-cost">$${cost.toFixed(2)}</span>
        </div>`;
      }).join('')}
    </div>`;
}

function renderLog(state) {
  const el = document.getElementById('log-content');
  const log = state.log || [];
  if (log.length === 0) { el.innerHTML = '<div class="empty">No activity logged</div>'; return; }
  const entries = log.slice(-50).reverse();
  el.innerHTML = entries.map(e => {
    const agentCls = 'log-agent-' + (e.agent || '').replace(/\s+/g, '-');
    return `<div class="log-entry">
      <span class="log-time">${formatTime(e.timestamp)}</span>
      <span class="log-agent ${agentCls}">${e.agent || '—'}</span>
      <span class="log-action">${e.action || ''}</span>
      <span class="log-cost">${e.cost_usd ? '$'+e.cost_usd.toFixed(3) : ''}</span>
    </div>`;
  }).join('');
}

// ═══ Agent Logs ═══
async function loadAgentLogs() {
  const el = document.getElementById('agent-logs-content');
  if (!el) return;

  // Preserve open states
  const openFiles = new Set();
  el.querySelectorAll('.agent-log-item.open').forEach(item => {
    const f = item.dataset.file;
    if (f) openFiles.add(f);
  });

  try {
    const resp = await fetch('./logs/');
    if (!resp.ok) { el.innerHTML = '<div class="empty">No logs/ directory yet.</div>'; return; }
    const html = await resp.text();
    const fileMatches = html.match(/href="([^"]+\.json)"/g) || [];
    const files = fileMatches.map(m => m.match(/href="([^"]+)"/)[1]).sort().reverse();
    if (files.length === 0) { el.innerHTML = '<div class="empty">No log files yet.</div>'; return; }

    const logs = [];
    for (const file of files.slice(0, 30)) {
      try {
        const r = await fetch('./logs/' + file);
        if (r.ok) {
          const data = await r.json();
          const parts = file.replace('.json', '').split('_');
          const agent = parts.slice(2).join('_') || 'unknown';
          const time = parts[0] && parts[1]
            ? parts[0].slice(0,4)+'-'+parts[0].slice(4,6)+'-'+parts[0].slice(6,8)+' '+parts[1].slice(0,2)+':'+parts[1].slice(2,4)+':'+parts[1].slice(4,6)
            : file;
          logs.push({ file, agent, time, data });
        }
      } catch {}
    }
    if (logs.length === 0) { el.innerHTML = '<div class="empty">Could not parse logs.</div>'; return; }

    el.innerHTML = logs.map(log => {
      const isSuccess = log.data.subtype === 'success';
      const agentCls = log.agent.includes('product-owner') ? 'po' : log.agent.includes('dev') ? 'dev' : log.agent.includes('tester') ? 'tester' : '';
      const result = (log.data.result || 'No result').slice(0, 3000);
      const stopReason = log.data.stop_reason || log.data.stopReason || '—';
      const cost = log.data.total_cost_usd ? '$'+log.data.total_cost_usd.toFixed(3) : '';
      const isOpen = openFiles.has(log.file) ? ' open' : '';
      return `<div class="agent-log-item${isOpen}" data-file="${log.file}" onclick="this.classList.toggle('open')">
        <div class="agent-log-header">
          <span class="agent-log-chevron">▸</span>
          <span class="agent-log-agent ${agentCls}">${log.agent}</span>
          <span class="agent-log-status ${isSuccess ? 'success' : 'error'}">${isSuccess ? 'OK' : 'FAIL'}</span>
          <span class="agent-log-stop">${stopReason}</span>
          <span class="agent-log-time">${cost} · ${log.time}</span>
        </div>
        <div class="agent-log-body">${escapeHtml(result)}</div>
      </div>`;
    }).join('');
  } catch (err) {
    el.innerHTML = `<div class="empty">Error: ${err.message}</div>`;
  }
}

function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
function formatTime(iso) { if (!iso) return '—'; try { return new Date(iso).toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' }); } catch { return '—'; } }
function numFmt(n) { return n == null ? '0' : n.toLocaleString(); }
function statusToDot(s) {
  return { 'done':'dot-done','in-progress':'dot-in-progress','in-testing':'dot-in-progress','approved':'dot-approved',
    'defect-found':'dot-defect','resolved':'dot-in-progress','blocked':'dot-blocked','requirements-defect':'dot-defect',
    'in-review':'dot-in-progress' }[s] || 'dot-not-started';
}

// Init
loadState();
autoRefreshInterval = setInterval(loadState, 15000);
</script>
</body>
</html>
