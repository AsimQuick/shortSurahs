# ---
# file: ci.yml
# stack: react-native-expo
# purpose: GitHub Actions CI — lint, typecheck, and test
# created-by: project-lead
# ---

name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint . --max-warnings 0

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests with coverage
        run: npm test -- --coverage --coverageThreshold='{"global":{"branches":70,"functions":70,"lines":70}}'
